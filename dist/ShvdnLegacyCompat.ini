; ShvdnLegacyCompat - run scripts made for older ScriptHookVDotNet builds on the current nightly.
; Log: ShvdnLegacyCompat\ShvdnLegacyCompat.log (lists added members and scripts that still have problems).
[ShvdnLegacyCompat]
; Set to false to disable the compatibility layer without removing the .asi.
Enabled=true

; Redirect = patched API copies live in ShvdnLegacyCompat\cache and SHVDN is redirected to them in memory;
;            nothing in the game folder is modified (default).
; Disk     = write the patched API over ScriptHookVDotNet2/3.dll (originals saved as *.legacycompat.bak).
;            Use this only if Redirect does not work on your system.
; Restore  = put the *.legacycompat.bak originals back (undo Disk), then switch back to Redirect or Off.
; Off      = do not patch anything, only check scripts and log what they are missing.
Mode=Redirect

; Which API versions to patch.
PatchV2=true
PatchV3=true

; Check every script in the SHVDN scripts folder at startup and log API members that are still missing.
ScanScripts=true

; Only matters on the very first start (or after updating SHVDN/this mod): how long (ms) SHVDN may be held
; back if it loads its API before the patched copy is built. Later starts use the cache instantly.
WaitTimeoutMs=20000
